<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, interactive-widget=resizes-content, viewport-fit=cover">
    <meta name="theme-color" content="#161615">
    <script>
      // Theme before first paint: the Settings choice (cadre_theme), else the system's.
      // Settings calls applyCadreTheme() after saving; System follows OS changes live.
      (() => {
        const light = matchMedia('(prefers-color-scheme: light)');
        window.applyCadreTheme = () => {
          let choice = null;
          try { choice = localStorage.getItem('cadre_theme'); } catch { /* storage may be blocked */ }
          const theme = choice === 'light' || choice === 'dark' ? choice : (light.matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f0eee8' : '#161615';
        };
        window.applyCadreTheme();
        light.addEventListener('change', window.applyCadreTheme);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="Self-hosted control plane for coding-agent sessions">

    <title>Cadre</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/vendor/npm/katex/dist/katex.min.css">
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/npm/preact/dist/preact.module.js",
          "preact/hooks": "/vendor/npm/preact/hooks/dist/hooks.module.js",
          "htm": "/vendor/npm/htm/dist/htm.module.js",
          "htm/preact": "/vendor/npm/htm/preact/index.module.js",
          "preact-router": "/vendor/npm/preact-router/dist/preact-router.module.js",
          "@preact/signals": "/vendor/npm/@preact/signals/dist/signals.module.js",
          "@preact/signals-core": "/vendor/npm/@preact/signals-core/dist/signals-core.module.js",
          "marked": "/vendor/npm/marked/lib/marked.esm.js",
          "katex": "/vendor/npm/katex/dist/katex.mjs"
        }
      }
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/app/app.mjs"></script>
</body>
</html>
